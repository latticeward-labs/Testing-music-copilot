plugins {
    id 'com.android.application'
}
android {
    namespace 'com.latticeward.offlineprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.latticeward.offlinevoskprobe'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    // ABI-specific APKs with the exact same recognition model.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75'
}