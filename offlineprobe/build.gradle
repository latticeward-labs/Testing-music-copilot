plugins {
    id 'com.android.application'
}
android {
    namespace 'com.latticeward.offlineprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.latticeward.offlinevoskprobe'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75'
}