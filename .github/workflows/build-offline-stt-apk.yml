name: Build optimized offline English STT APK
on:
  push:
    branches: [main]
    paths:
      - "offlineprobe/**"
      - "settings.gradle"
      - ".github/workflows/build-offline-stt-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble-offline-apk:
    name: APK assembly ONLY - no tests or lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Bundle real Vosk English model inside APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offlineprobe/src/main/assets
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 20 \
            "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
            -o /tmp/vosk-en.zip
          unzip -tq /tmp/vosk-en.zip
          unzip -q /tmp/vosk-en.zip -d offlineprobe/src/main/assets
          test -s offlineprobe/src/main/assets/vosk-model-small-en-us-0.15/am/final.mdl
          test -s offlineprobe/src/main/assets/vosk-model-small-en-us-0.15/conf/model.conf
          printf "vosk-small-en-us-0.15-v1\n" > offlineprobe/src/main/assets/vosk-model-small-en-us-0.15/uuid
          echo "English model included in Android app assets."
      - name: Build APK ONLY (no tests, no lint)
        run: gradle --no-daemon --stacktrace :offlineprobe:assembleDebug
      - name: Prepare stand-alone APK and SHA256
        run: |
          mkdir -p release
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            apk="offlineprobe/build/outputs/apk/debug/offlineprobe-${abi}-debug.apk"
            test -s "$apk"
            output="release/Offline-Vosk-STT-Probe-${abi}.apk"
            cp "$apk" "$output"
            sha256sum "$output" > "${output}.sha256"
            stat -c "$abi APK bytes: %s" "$output"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Offline-Vosk-STT-Probe-Optimized-APK
          path: release/
          retention-days: 14
          if-no-files-found: error
