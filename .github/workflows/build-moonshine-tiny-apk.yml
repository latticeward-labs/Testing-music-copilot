name: Build Moonshine Tiny Offline STT APK
on:
  push:
    branches: [ main ]
    paths:
      - "moonshineprobe/**"
      - "settings.gradle"
      - "build.gradle"
      - ".github/workflows/build-moonshine-tiny-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    name: Assemble offline APK (no tests)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Embed Moonshine v2 English model
        run: |
          set -euo pipefail
          model=sherpa-onnx-moonshine-tiny-en-quantized-2026-02-27
          mkdir -p moonshineprobe/src/main/assets
          curl -fL --retry 4 --retry-delay 5 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$model.tar.bz2" -o /tmp/moonshine.tar.bz2
          tar -xjf /tmp/moonshine.tar.bz2 -C moonshineprobe/src/main/assets
          test -s "moonshineprobe/src/main/assets/$model/encoder_model.ort"
          test -s "moonshineprobe/src/main/assets/$model/decoder_model_merged.ort"
          test -s "moonshineprobe/src/main/assets/$model/tokens.txt"
          rm -rf "moonshineprobe/src/main/assets/$model/test_wavs"
      - name: Embed official Sherpa ONNX Android AAR
        run: |
          set -euo pipefail
          mkdir -p moonshineprobe/libs
          curl -fL --retry 4 --retry-delay 5 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-2.0.0.aar" -o moonshineprobe/libs/sherpa-onnx-2.0.0.aar
          echo "f0f8716982d27cb4ce695e3934018b1342d9d3d6fdb6ef1f1658fe8bad50b4fc  moonshineprobe/libs/sherpa-onnx-2.0.0.aar" | sha256sum -c -
      - name: Build APK only
        run: gradle --no-daemon --stacktrace :moonshineprobe:assembleDebug
      - name: Stage APK
        run: |
          mkdir -p release
          cp moonshineprobe/build/outputs/apk/debug/moonshineprobe-debug.apk release/Moonshine-Tiny-Offline-ARM64.apk
          sha256sum release/Moonshine-Tiny-Offline-ARM64.apk > release/Moonshine-Tiny-Offline-ARM64.apk.sha256
          stat -c "APK bytes: %s" release/Moonshine-Tiny-Offline-ARM64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Moonshine-Tiny-Offline-STT-APK
          path: release/
          retention-days: 14
          if-no-files-found: error
